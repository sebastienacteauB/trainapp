<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>
  <g transform="rotate(-45 50 50)">
    <!-- Left weight plate (outer rim darker) -->
    <rect x="12" y="36" width="18" height="28" rx="5" fill="#C97D00"/>
    <!-- Left weight plate (face bright) -->
    <rect x="14" y="38" width="14" height="24" rx="3" fill="#FFD700"/>
    <!-- Left collar -->
    <rect x="27" y="41" width="11" height="18" rx="3" fill="#FFE033"/>
    <!-- Center bar -->
    <rect x="37" y="46" width="26" height="8" rx="4" fill="#FFF5B0"/>
    <!-- Right collar -->
    <rect x="62" y="41" width="11" height="18" rx="3" fill="#FFE033"/>
    <!-- Right weight plate (face bright) -->
    <rect x="72" y="38" width="14" height="24" rx="3" fill="#FFD700"/>
    <!-- Right weight plate (outer rim darker) -->
    <rect x="70" y="36" width="18" height="28" rx="5" fill="#C97D00"/>
  </g>
</svg>
