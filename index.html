<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<title>TrainApp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --accent:#6366f1;--accent2:#818cf8;
  --ok:#22c55e;--ok-bg:#14532d;
  --err:#ef4444;
  --border:rgba(255,255,255,0.07);
  --r:12px;--rr:8px;
  --navh:64px;--hdrh:56px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:16px 16px calc(var(--navh)+24px);overflow-y:auto;-webkit-overflow-scrolling:touch}

.hdr{height:var(--hdrh);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20}
.hdr-title{flex:1;font-size:17px;font-weight:600}
.hdr-sub{font-size:12px;color:var(--text2);margin-top:1px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;user-select:none}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--navh);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;padding:8px 0;transition:color .15s;-webkit-appearance:none}
.nav-item.on{color:var(--accent2)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:10px}
.card-row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:background .1s}
.card-row:active{background:var(--bg3)}

.ex-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;background:var(--bg3);color:var(--text)}
.ex-badge.done{background:var(--ok-bg);color:#86efac}
.ex-badge.active{background:var(--accent);color:#fff}
.ex-badge svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}

.set-grid{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--border)}
.set-lbl{font-size:12px;color:var(--text3);text-align:center}
.set-inp{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rr);padding:9px 6px;text-align:center;font-size:15px;color:var(--text);width:100%;outline:none;-moz-appearance:textfield;-webkit-appearance:none}
.set-inp::-webkit-outer-spin-button,.set-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.set-inp:focus{border-color:var(--accent)}
.set-inp.ck{border-color:#22c55e44;background:#14532d55;color:#86efac}
.chk-btn{width:40px;height:40px;border-radius:var(--rr);border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.chk-btn.done{background:var(--ok-bg);border-color:#22c55e33;color:#86efac}
.chk-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.chip{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.chip.wm{border-color:var(--accent);color:var(--accent2);background:rgba(99,102,241,.1)}

.prog-bar{height:3px;background:var(--bg3);margin:0 0 12px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);transition:width .3s}

.tots{display:flex;gap:8px;margin-bottom:12px}
.tot-card{flex:1;background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);padding:10px 12px;text-align:center}
.tot-val{font-size:20px;font-weight:600}
.tot-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.demo-row{display:flex;gap:8px;padding:12px 14px 4px}
.demo-img{flex:1;aspect-ratio:4/3;object-fit:cover;border-radius:var(--rr);background:var(--bg3);min-width:0}
.demo-ph{flex:1;aspect-ratio:4/3;border-radius:var(--rr);background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);font-size:11px;text-align:center;padding:8px}

.prof-card{background:var(--bg2);border-radius:16px;border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s;-webkit-tap-highlight-color:transparent}
.prof-card:active{border-color:var(--accent)}
.prof-av{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--rr);border:none;cursor:pointer;font-size:14px;font-weight:500;transition:opacity .15s;-webkit-appearance:none}
.btn:active{opacity:.8}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:active{background:var(--bg3)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--err);border:1px solid rgba(239,68,68,.2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.f-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.f-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rr);padding:10px 12px;color:var(--text);font-size:14px;outline:none;-webkit-appearance:none}
.f-input:focus{border-color:var(--accent)}
textarea.f-input{resize:vertical;min-height:68px;line-height:1.5}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f-group{margin-bottom:12px}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center;max-width:480px;left:50%;transform:translateX(-50%)}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-height:92dvh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}

.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:var(--rr);padding:4px;margin-bottom:14px}
.tab-btn{flex:1;padding:8px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.tab-btn.on{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}

.sec-ttl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:16px 0 8px}
.sec-ttl:first-child{margin-top:0}

.lp{font-size:11px;color:var(--text3);padding:6px 14px 10px;border-top:1px solid var(--border)}

.hist-item{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);padding:14px 16px;margin-bottom:8px}
.empty{text-align:center;padding:60px 24px;color:var(--text3)}
.empty-ico{font-size:40px;margin-bottom:12px;display:block}

.back-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;display:flex;align-items:center;margin-right:4px}
.back-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

const STORAGE_KEY = 'trainapp_v1';
const IMG_BASE = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const DAYS = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

function parseSetsMax(v) {
  if (typeof v === 'number') return v;
  const parts = String(v).split(/[-–]/);
  return parseInt(parts[parts.length - 1]) || 3;
}

function genId() { return 'ex-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }

// ── DEFAULT DATA ───────────────────────────────────────────
const DEFAULTS = {
  sebastien: {
    name:'Sébastien', initials:'SA', color:'#6366f1',
    startDate:'2026-09-21', trainingDays:[1,3,5],
    notes:'Modèle progression double : 10–12 reps → augmenter la charge ; 6–8 reps → chercher plus de reps. RIR cible 2–3, éviter 0.',
    seances:{
      A:[
        {id:'hip-thrust',name:'GD Hip Thrust',sets:3,repsMin:8,repsMax:12,tempo:'2-.5-1-1',rir:'1–4',restMin:2,restMax:3,notes:'Possibilité de mettre un DB sur les hanches ou de le faire à une jambe.',workingMax:64,dbId:'Barbell_Hip_Thrust',ytId:''},
        {id:'push-up',name:'Push-Up',sets:3,repsMin:8,repsMax:12,tempo:'3-1-1-.5',rir:'1–4',restMin:2,restMax:3,notes:'Si trop facile pour 12 reps, surélever les pieds et ralentir le tempo!',workingMax:null,dbId:'Push-Ups_With_Feet_Elevated',ytId:''},
        {id:'weighted-crunch',name:'GD Weighted Crunch',sets:3,repsMin:8,repsMax:12,tempo:'2-1-1-0',rir:'1–4',restMin:2,restMax:3,notes:'Coudes vers l\'extérieur, penser à ramener les omoplates ensemble.',workingMax:21,dbId:'Weighted_Crunches',ytId:''},
        {id:'db-row',name:'Bent Over DB Row',sets:3,repsMin:8,repsMax:12,tempo:'2-1-1-.5',rir:'1–4',restMin:2,restMax:3,notes:'Coudes vers l\'extérieur, penser à ramener les omoplates ensemble.',workingMax:57,dbId:'Bent_Over_Two-Dumbbell_Row',ytId:''},
        {id:'lateral-raise',name:'GD Lateral Raise (DB)',sets:'2–3',repsMin:8,repsMax:12,tempo:'1-1-1-0',rir:'1–4',restMin:2,restMax:3,notes:'',workingMax:38,dbId:'Side_Lateral_Raise',ytId:''},
        {id:'bicep-curl',name:'GD Bicep Curl',sets:'2–3',repsMin:8,repsMax:12,tempo:'2-.5-1-1',rir:'1–4',restMin:2,restMax:3,notes:'',workingMax:32,dbId:'Dumbbell_Bicep_Curl',ytId:''}
      ],
      B:[
        {id:'pistol-squat',name:'Pistol Squat',sets:2,repsMin:8,repsMax:12,tempo:'2-.5-1-1',rir:'1–4',restMin:2,restMax:3,notes:'Utiliser un banc pour s\'aider + aide pour l\'équilibre au besoin.',workingMax:null,dbId:'',ytId:''},
        {id:'pike-pushup',name:'Pike Pushup',sets:3,repsMin:8,repsMax:12,tempo:'2-1-1-0',rir:'1–4',restMin:2,restMax:3,notes:'',workingMax:null,dbId:'',ytId:''},
        {id:'bulgarian',name:'GD Bulgarian Split Squat',sets:2,repsMin:8,repsMax:12,tempo:'3-1-1-.5',rir:'1–4',restMin:2,restMax:3,notes:'',workingMax:53,dbId:'',ytId:''},
        {id:'chest-fly',name:'GD Chest Fly',sets:'2–3',repsMin:8,repsMax:12,tempo:'2-1-1-.5',rir:'1–4',restMin:2,restMax:3,notes:'Couché au sol, avec DB.',workingMax:57,dbId:'',ytId:''},
        {id:'tricep-ext',name:'Lying Tricep Extension',sets:'2–3',repsMin:8,repsMax:12,tempo:'1-1-1-0',rir:'1–4',restMin:2,restMax:3,notes:'',workingMax:50,dbId:'Lying_Dumbbell_Tricep_Extension',ytId:''},
        {id:'garhammer',name:'GD Garhammer',sets:'2–3',repsMin:8,repsMax:12,tempo:'2-.5-1-1',rir:'1–4',restMin:2,restMax:3,notes:'Utiliser un divan pour se tenir au sol.',workingMax:null,dbId:'',ytId:''}
      ]
    },
    logs:[
      {id:'2026-10-19-A',date:'2026-10-19',seance:'A',sets:{'hip-thrust':[{r:12,w:45},{r:12,w:45}],'push-up':[{r:12,w:0},{r:12,w:0},{r:12,w:0}],'weighted-crunch':[{r:10,w:6},{r:6,w:6},{r:6,w:6}],'db-row':[{r:12,w:40},{r:12,w:40},{r:12,w:40}]},totalReps:117,totalLb:2607},
      {id:'2026-10-21-B',date:'2026-10-21',seance:'B',sets:{'pistol-squat':[{r:10,w:0},{r:10,w:0}],'pike-pushup':[{r:12,w:0},{r:12,w:0},{r:12,w:0}],'bulgarian':[{r:10,w:40},{r:10,w:40}],'chest-fly':[{r:12,w:40},{r:12,w:40},{r:12,w:40}],'tricep-ext':[{r:12,w:35},{r:12,w:35},{r:12,w:35}],'garhammer':[{r:12,w:0},{r:11,w:0},{r:12,w:0}]},totalReps:183,totalLb:3500}
    ]
  },
  cathryna: {
    name:'Cathryna', initials:'CA', color:'#a855f7',
    startDate:'2026-09-21', trainingDays:[1,3,5],
    notes:'',
    seances:{ A:[], B:[] },
    logs:[]
  }
};

// ── STATE ──────────────────────────────────────────────────
const S = { data:null, pid:null, route:'profile', exId:null, progTab:'A' };

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      S.data = JSON.parse(raw);
      for (const pid of Object.keys(DEFAULTS)) {
        if (!S.data[pid]) S.data[pid] = JSON.parse(JSON.stringify(DEFAULTS[pid]));
      }
    } else {
      S.data = JSON.parse(JSON.stringify(DEFAULTS));
    }
  } catch { S.data = JSON.parse(JSON.stringify(DEFAULTS)); }
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.data)); }
function prof() { return S.data[S.pid]; }

// ── ROTATION ───────────────────────────────────────────────
function seanceForDate(p, ds) {
  const start = new Date(p.startDate + 'T12:00:00');
  const d = new Date(ds + 'T12:00:00');
  const days = Math.round((d - start) / 86400000);
  if (days < 0) return null;
  const week = Math.floor(days / 7) + 1;
  const dow = d.getDay();
  const idx = p.trainingDays.indexOf(dow);
  if (idx === -1) return null;
  const odd = week % 2 === 1;
  return (odd ? ['A','B','A'] : ['B','A','B'])[idx] || 'A';
}

function nextSession(p) {
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const ds = d.toISOString().slice(0,10);
    const s = seanceForDate(p, ds);
    if (s) return { date:ds, seance:s };
  }
  return null;
}

function activeLog(p, date, seance) {
  return (p.logs||[]).find(l => l.date===date && l.seance===seance);
}

function lastSets(p, exId) {
  const logs = [...(p.logs||[])].reverse();
  for (const l of logs) if (l.sets && l.sets[exId]) return l.sets[exId];
  return null;
}

function calcTotals(sets) {
  let reps=0, lb=0;
  for (const exSets of Object.values(sets||{}))
    for (const s of (exSets||[])) { reps += s.r||0; lb += (s.r||0)*(s.w||0); }
  return {reps,lb};
}

// ── ICONS ──────────────────────────────────────────────────
const ICONS = {
  dumbbell: '<path d="M6.5 6.5h11"/><path d="M4.5 4.5a2 2 0 1 0 2.83 2.83"/><path d="M19.5 19.5a2 2 0 1 0-2.83-2.83"/><path d="M4.5 19.5a2 2 0 1 0 2.83-2.83"/><path d="M19.5 4.5a2 2 0 1 0-2.83 2.83"/><line x1="6.5" y1="17.5" x2="17.5" y2="6.5"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><polyline points="12 7 12 12 15 15"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  back: '<polyline points="15 18 9 12 15 6"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  chevright: '<polyline points="9 18 15 12 9 6"/>'
};

function ico(name) { return `<svg viewBox="0 0 24 24">${ICONS[name]||''}</svg>`; }

// ── DOM HELPERS ────────────────────────────────────────────
const $i = id => document.getElementById(id);
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function app() { return $i('app'); }

// ── PROFILE SCREEN ─────────────────────────────────────────
function showProfile() {
  const a = app(); a.innerHTML = '';
  const hdr = el('div','hdr','<div class="hdr-title">TrainApp</div>');
  a.appendChild(hdr);
  const c = el('div','screen');
  c.style.cssText = 'display:flex;flex-direction:column;gap:16px;padding-top:32px';
  c.innerHTML = `<div style="margin-bottom:8px"><div style="font-size:22px;font-weight:700;margin-bottom:4px">Choisir un profil</div><div style="color:var(--text2);font-size:14px">Données sauvegardées localement sur cet appareil</div></div>`;
  for (const [pid, p] of Object.entries(S.data)) {
    const ns = nextSession(p);
    const card = el('div','prof-card');
    card.innerHTML = `<div class="prof-av" style="background:${p.color}25;color:${p.color}">${p.initials}</div><div style="font-size:18px;font-weight:600">${p.name}</div><div style="font-size:12px;color:var(--text2)">${ns ? `Prochaine : Séance ${ns.seance} · ${fmtDate(ns.date)}` : 'Aucune séance planifiée'}</div>`;
    card.addEventListener('click', () => { S.pid = pid; nav('training'); });
    c.appendChild(card);
  }
  a.appendChild(c);
}

// ── TRAINING SCREEN ────────────────────────────────────────
function showTraining() {
  const p = prof();
  const ns = nextSession(p);
  const a = app(); a.innerHTML = '';

  if (!ns) {
    a.innerHTML = '<div class="empty"><span class="empty-ico">😕</span><div>Aucune séance planifiée</div></div>';
    renderNav('training'); return;
  }

  const { date, seance } = ns;
  const exercises = p.seances[seance] || [];
  const log = activeLog(p, date, seance);
  const logSets = log ? log.sets : {};
  const tots = calcTotals(logSets);
  const doneCount = Object.keys(logSets).length;

  const hdr = el('div','hdr');
  hdr.innerHTML = `<div style="flex:1"><div class="hdr-title">Entraînement</div><div class="hdr-sub">Séance ${seance} · ${fmtDate(date)}</div></div><div class="avatar" id="av-btn" style="background:${p.color}25;color:${p.color}">${p.initials}</div>`;
  a.appendChild(hdr);
  $i('av-btn').addEventListener('click', () => nav('profile'));

  const c = el('div','screen');

  const totRow = el('div','tots');
  totRow.id = 'tot-row';
  totRow.innerHTML = `<div class="tot-card"><div class="tot-val" id="tv-reps">${tots.reps}</div><div class="tot-lbl">Reps</div></div><div class="tot-card"><div class="tot-val" style="color:var(--accent2)" id="tv-lb">${tots.lb}</div><div class="tot-lbl">Lb</div></div><div class="tot-card"><div class="tot-val" id="tv-done">${doneCount}/${exercises.length}</div><div class="tot-lbl">Faits</div></div>`;
  c.appendChild(totRow);

  const bar = el('div','prog-bar');
  bar.innerHTML = `<div class="prog-fill" id="prog" style="width:${exercises.length ? doneCount/exercises.length*100 : 0}%"></div>`;
  c.appendChild(bar);

  if (exercises.length === 0) {
    c.innerHTML += '<div class="empty" style="padding:32px 0"><span class="empty-ico">📋</span><div>Aucun exercice — configure dans Programme</div></div>';
  }

  exercises.forEach((ex, i) => {
    const letter = String.fromCharCode(65+i);
    const done = logSets[ex.id];
    const lp = lastSets(p, ex.id);
    const card = el('div','card');
    const row = el('div','card-row');
    const setsSummary = done
      ? done.map(s=>`${s.r}×${s.w}lb`).join(', ')
      : `${ex.sets} sets · ${ex.repsMin}–${ex.repsMax} reps`;
    row.innerHTML = `<div class="ex-badge ${done?'done':''}">${done ? ico('check') : letter}</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${setsSummary}</div></div>${ico('chevright').replace('<svg','<svg style="width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0"')}`;
    row.addEventListener('click', () => { S.exId = ex.id; nav('exercise'); });
    card.appendChild(row);
    if (lp && !done) {
      const lpEl = el('div','lp');
      lpEl.innerHTML = `Dernière fois : <strong style="color:var(--text2)">${lp.map(s=>`${s.r}×${s.w}lb`).join(' · ')}</strong>`;
      card.appendChild(lpEl);
    }
    c.appendChild(card);
  });

  if (p.notes) {
    const n = el('div','card');
    n.style.marginTop='8px';
    n.innerHTML = `<div style="padding:12px 14px;font-size:12px;color:var(--text2);border-left:3px solid var(--accent);line-height:1.6">${p.notes}</div>`;
    c.appendChild(n);
  }
  a.appendChild(c);
  renderNav('training');
}

// ── EXERCISE SCREEN ────────────────────────────────────────
function showExercise() {
  const p = prof();
  const ns = nextSession(p);
  if (!ns) return nav('training');
  const { date, seance } = ns;
  const exercises = p.seances[seance] || [];
  const ex = exercises.find(e => e.id === S.exId);
  if (!ex) return nav('training');

  const log = activeLog(p, date, seance);
  const existSets = (log && log.sets && log.sets[ex.id]) || [];
  const lp = lastSets(p, ex.id);
  const numSets = parseSetsMax(ex.sets);

  const a = app(); a.innerHTML = '';
  const hdr = el('div','hdr');
  hdr.innerHTML = `<button class="back-btn" id="back">${ico('back')}</button><div style="flex:1"><div class="hdr-title" style="font-size:15px">${ex.name}</div><div class="hdr-sub">Séance ${seance}</div></div>`;
  a.appendChild(hdr);
  $i('back').addEventListener('click', () => nav('training'));

  const c = el('div','screen');

  // Demo
  if (ex.dbId) {
    const dr = el('div','demo-row');
    dr.innerHTML = `<img class="demo-img" src="${IMG_BASE}${ex.dbId}/0.jpg" loading="lazy" onerror="this.parentNode.innerHTML='<div class=demo-ph>Image non disponible</div>'" alt="Départ"><img class="demo-img" src="${IMG_BASE}${ex.dbId}/1.jpg" loading="lazy" onerror="this.style.display='none'" alt="Arrivée">`;
    c.appendChild(dr);
  } else if (ex.ytId) {
    const yt = el('div'); yt.style.cssText='margin-bottom:12px;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9';
    yt.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ex.ytId}" frameborder="0" allowfullscreen style="border:none"></iframe>`;
    c.appendChild(yt);
  } else {
    const ph = el('div','demo-row');
    ph.innerHTML = `<div class="demo-ph" style="flex:1;aspect-ratio:3/1"><div style="font-size:20px;margin-bottom:6px">💪</div><div>Aucune démo — ajoute un ID dans Programme</div></div>`;
    c.appendChild(ph);
  }

  // Chips
  const chips = el('div','chips');
  chips.innerHTML = `<span class="chip">${ex.sets} sets</span><span class="chip">${ex.repsMin}–${ex.repsMax} reps</span><span class="chip">Tempo ${ex.tempo}</span><span class="chip">RIR ${ex.rir}</span><span class="chip">Repos ${ex.restMin}–${ex.restMax} min</span>${ex.workingMax ? `<span class="chip wm" id="wm-chip">WM ${ex.workingMax} lb</span>` : ''}`;
  c.appendChild(chips);

  if (ex.notes) {
    const n = el('div','card'); n.style.marginBottom='12px';
    n.innerHTML = `<div style="padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.6">${ex.notes}</div>`;
    c.appendChild(n);
  }

  // Sets
  const sTitle = el('div','sec-ttl'); sTitle.textContent = 'Logger les sets';
  c.appendChild(sTitle);
  const sCard = el('div','card'); sCard.id = 'sets-card';
  const sHdr = el('div'); sHdr.style.cssText='display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border)';
  sHdr.innerHTML = '<div style="font-size:11px;color:var(--text3);text-align:center">#</div><div style="font-size:11px;color:var(--text3);text-align:center">Reps</div><div style="font-size:11px;color:var(--text3);text-align:center">Poids (lb)</div><div></div>';
  sCard.appendChild(sHdr);

  for (let i=0; i<numSets; i++) {
    const saved = existSets[i];
    const prev = lp && lp[i];
    const ck = !!saved;
    const row = el('div','set-grid'); row.id = `sr-${i}`;
    row.innerHTML = `<div class="set-lbl">${i+1}</div><input id="r-${i}" type="number" min="0" max="99" inputmode="numeric" class="set-inp${ck?' ck':''}" value="${ck ? saved.r : (prev ? prev.r : '')}" placeholder="${ex.repsMin}"><input id="w-${i}" type="number" min="0" max="999" step="2.5" inputmode="decimal" class="set-inp${ck?' ck':''}" value="${ck ? saved.w : (prev ? prev.w : '0')}" placeholder="lb"><button class="chk-btn${ck?' done':''}" data-i="${i}">${ico('check')}</button>`;
    if (ck) row.style.opacity='.8';
    sCard.appendChild(row);
  }
  c.appendChild(sCard);

  if (lp) {
    const lpEl = el('div'); lpEl.style.cssText='font-size:11px;color:var(--text3);padding:6px 2px 0;margin-bottom:12px';
    lpEl.innerHTML = 'Dernière fois : ' + lp.map((s,i)=>`<strong style="color:var(--text2)">S${i+1}: ${s.r}×${s.w}lb</strong>`).join(' · ');
    c.appendChild(lpEl);
  }

  // Working max
  const wmCard = el('div','card'); wmCard.style.marginTop='14px';
  wmCard.innerHTML = `<div style="padding:12px 14px;display:flex;align-items:center;gap:12px"><div style="flex:1;font-size:13px">Working Max</div><input id="wm-inp" type="number" inputmode="decimal" style="width:80px" class="set-inp" value="${ex.workingMax||''}" placeholder="lb"><button id="wm-save" class="btn btn-ghost" style="padding:8px 12px;font-size:12px">Sauver</button></div>`;
  c.appendChild(wmCard);
  a.appendChild(c);
  renderNav('training');

  // Check buttons
  sCard.querySelectorAll('.chk-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      const rIn = $i(`r-${i}`), wIn = $i(`w-${i}`);
      const r = parseInt(rIn.value)||0, w = parseFloat(wIn.value)||0;
      const already = btn.classList.contains('done');
      let lg = activeLog(p, date, seance);
      if (!lg) { lg = {id:`${date}-${seance}`,date,seance,sets:{},totalReps:0,totalLb:0}; p.logs.push(lg); }
      if (!lg.sets) lg.sets = {};
      if (already) {
        if (lg.sets[ex.id]) { lg.sets[ex.id].splice(i,1); if (!lg.sets[ex.id].length) delete lg.sets[ex.id]; }
        btn.classList.remove('done'); rIn.classList.remove('ck'); wIn.classList.remove('ck');
        $i(`sr-${i}`).style.opacity='1';
      } else {
        if (!lg.sets[ex.id]) lg.sets[ex.id]=[];
        lg.sets[ex.id][i]={r,w};
        btn.classList.add('done'); rIn.classList.add('ck'); wIn.classList.add('ck');
        $i(`sr-${i}`).style.opacity='.8';
      }
      const t = calcTotals(lg.sets);
      lg.totalReps=t.reps; lg.totalLb=t.lb;
      save();
    });
  });

  $i('wm-save').addEventListener('click', () => {
    const v = parseFloat($i('wm-inp').value);
    if (!isNaN(v) && v>0) {
      ex.workingMax = v; save();
      const chip = $i('wm-chip');
      if (chip) chip.textContent = `WM ${v} lb`;
      else { const nc=el('span','chip wm'); nc.id='wm-chip'; nc.textContent=`WM ${v} lb`; document.querySelector('.chips').appendChild(nc); }
      const sb = $i('wm-save'); sb.textContent='✓'; setTimeout(()=>{if(sb)sb.textContent='Sauver';},1500);
    }
  });
}

// ── PROGRAM SCREEN ─────────────────────────────────────────
function showProgram() {
  const p = prof();
  const a = app(); a.innerHTML='';
  const hdr = el('div','hdr');
  hdr.innerHTML=`<div style="flex:1"><div class="hdr-title">Programme</div><div class="hdr-sub">${p.name}</div></div><div class="avatar" id="av-btn" style="background:${p.color}25;color:${p.color}">${p.initials}</div>`;
  a.appendChild(hdr);
  $i('av-btn').addEventListener('click', () => nav('profile'));
  const c = el('div','screen');

  const tabs = el('div','tabs');
  tabs.innerHTML=`<button class="tab-btn${S.progTab==='A'?' on':''}" data-s="A">Séance A</button><button class="tab-btn${S.progTab==='B'?' on':''}" data-s="B">Séance B</button>`;
  tabs.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{S.progTab=b.dataset.s;showProgram();}));
  c.appendChild(tabs);

  const exercises = p.seances[S.progTab]||[];
  if (exercises.length===0) {
    const em = el('div','empty'); em.style.padding='32px 0';
    em.innerHTML='<span class="empty-ico">📋</span><div>Aucun exercice dans cette séance</div>';
    c.appendChild(em);
  }

  exercises.forEach((ex,i)=>{
    const letter = String.fromCharCode(65+i);
    const card = el('div','card'); card.style.marginBottom='8px';
    const row = el('div','card-row'); row.style.cursor='default';
    row.innerHTML=`<div class="ex-badge">${letter}</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div><div style="font-size:12px;color:var(--text2)">${ex.sets} sets · ${ex.repsMin}–${ex.repsMax} reps · ${ex.tempo}</div></div><button class="btn btn-ghost edit-btn" data-id="${ex.id}" style="padding:6px 10px;font-size:12px;flex-shrink:0">${ico('edit')} Modifier</button>`;
    card.appendChild(row);
    c.appendChild(card);
  });

  const addBtn = el('button','btn btn-primary'); addBtn.style.cssText='width:100%;margin-top:4px';
  addBtn.innerHTML = `${ico('plus')} Ajouter un exercice`;
  addBtn.addEventListener('click', ()=>showExModal(null));
  c.appendChild(addBtn);

  const configTitle = el('div','sec-ttl'); configTitle.textContent='Configuration du profil'; c.appendChild(configTitle);

  const cfgCard = el('div','card');
  cfgCard.innerHTML=`<div style="padding:14px">
    <div class="f-group"><label class="f-label">Jours d'entraînement (0=Dim, 1=Lun, 2=Mar…)</label><input id="cfg-days" class="f-input" value="${p.trainingDays.join(',')}" placeholder="1,3,5"></div>
    <div class="f-group"><label class="f-label">Date de début du programme (AAAA-MM-JJ)</label><input id="cfg-start" class="f-input" type="date" value="${p.startDate}"></div>
    <div class="f-group"><label class="f-label">Notes et principes du programme</label><textarea id="cfg-notes" class="f-input">${p.notes||''}</textarea></div>
    <button id="cfg-save" class="btn btn-ghost" style="width:100%">Sauvegarder la configuration</button>
  </div>`;
  c.appendChild(cfgCard);
  a.appendChild(c);
  renderNav('program');

  c.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click',()=>showExModal(b.dataset.id)));
  $i('cfg-save').addEventListener('click',()=>{
    const daysRaw=$i('cfg-days').value.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)&&n>=0&&n<=6);
    if(daysRaw.length) p.trainingDays=daysRaw;
    const sd=$i('cfg-start').value; if(sd) p.startDate=sd;
    p.notes=$i('cfg-notes').value;
    save();
    const btn=$i('cfg-save'); btn.textContent='✓ Sauvegardé';
    setTimeout(()=>{if(btn)btn.textContent='Sauvegarder la configuration';},2000);
  });
}

// ── EXERCISE MODAL ─────────────────────────────────────────
function showExModal(exId) {
  const p = prof();
  const exercises = p.seances[S.progTab]||[];
  const ex = exId ? exercises.find(e=>e.id===exId) : null;
  const isNew = !ex;

  const ov = el('div','modal-ov'); ov.id='modal-ov';
  const m = el('div','modal');
  m.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:16px"><div class="modal-title" style="flex:1;margin:0">${isNew?'Ajouter un exercice':'Modifier l\'exercice'}</div><button id="m-close" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1">✕</button></div>
  <div class="f-group"><label class="f-label">Nom de l'exercice *</label><input id="f-name" class="f-input" value="${ex?ex.name:''}" placeholder="ex: GD Hip Thrust" autocomplete="off"></div>
  <div class="f-row">
    <div class="f-group"><label class="f-label">Sets</label><input id="f-sets" class="f-input" value="${ex?ex.sets:'3'}" placeholder="3 ou 2–3"></div>
    <div class="f-group"><label class="f-label">Reps min / max</label><div style="display:flex;gap:6px"><input id="f-rmin" type="number" class="f-input" value="${ex?ex.repsMin:8}" placeholder="8"><input id="f-rmax" type="number" class="f-input" value="${ex?ex.repsMax:12}" placeholder="12"></div></div>
  </div>
  <div class="f-row">
    <div class="f-group"><label class="f-label">Tempo</label><input id="f-tempo" class="f-input" value="${ex?ex.tempo:''}" placeholder="2-1-1-0"></div>
    <div class="f-group"><label class="f-label">RIR</label><input id="f-rir" class="f-input" value="${ex?ex.rir:'1–4'}" placeholder="1–4"></div>
  </div>
  <div class="f-row">
    <div class="f-group"><label class="f-label">Repos min (min)</label><input id="f-restmin" type="number" class="f-input" value="${ex?ex.restMin:2}" placeholder="2"></div>
    <div class="f-group"><label class="f-label">Repos max (min)</label><input id="f-restmax" type="number" class="f-input" value="${ex?ex.restMax:3}" placeholder="3"></div>
  </div>
  <div class="f-group"><label class="f-label">Working Max (lb)</label><input id="f-wm" type="number" class="f-input" value="${ex&&ex.workingMax?ex.workingMax:''}" placeholder="ex: 64"></div>
  <div class="f-group"><label class="f-label">Notes du coach</label><textarea id="f-notes" class="f-input">${ex?ex.notes:''}</textarea></div>
  <div class="f-group"><label class="f-label">Exercise DB ID <span style="color:var(--text3);font-size:10px">(pour les images de démo)</span></label><input id="f-dbid" class="f-input" value="${ex?ex.dbId:''}" placeholder="ex: Barbell_Hip_Thrust" autocomplete="off"><div style="font-size:10px;color:var(--text3);margin-top:4px">Source : github.com/yuhonas/free-exercise-db</div></div>
  <div class="f-group"><label class="f-label">YouTube ID <span style="color:var(--text3);font-size:10px">(si pas de DB image)</span></label><input id="f-ytid" class="f-input" value="${ex?ex.ytId:''}" placeholder="ex: dQw4w9WgXcQ" autocomplete="off"></div>
  ${!isNew?`<button id="del-ex" class="btn btn-danger" style="width:100%;margin-bottom:10px">${ico('trash')} Supprimer cet exercice</button>`:''}
  <button id="save-ex" class="btn btn-primary" style="width:100%">${isNew?ico('plus')+' Ajouter':ico('check')+' Sauvegarder'}</button>`;

  ov.appendChild(m);
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  $i('m-close').addEventListener('click',closeModal);

  $i('save-ex').addEventListener('click',()=>{
    const name=$i('f-name').value.trim();
    if(!name){$i('f-name').focus();return;}
    const data={
      id: ex?ex.id:genId(), name,
      sets:$i('f-sets').value||'3',
      repsMin:parseInt($i('f-rmin').value)||8,
      repsMax:parseInt($i('f-rmax').value)||12,
      tempo:$i('f-tempo').value,
      rir:$i('f-rir').value,
      restMin:parseInt($i('f-restmin').value)||2,
      restMax:parseInt($i('f-restmax').value)||3,
      workingMax:parseFloat($i('f-wm').value)||null,
      notes:$i('f-notes').value,
      dbId:$i('f-dbid').value.trim(),
      ytId:$i('f-ytid').value.trim()
    };
    if(!p.seances[S.progTab])p.seances[S.progTab]=[];
    if(isNew){p.seances[S.progTab].push(data);}
    else{const idx=exercises.findIndex(e=>e.id===exId);if(idx!==-1)exercises[idx]=data;}
    save();closeModal();showProgram();
  });

  if(!isNew){
    $i('del-ex').addEventListener('click',()=>{
      if(!confirm(`Supprimer « ${ex.name} » ?`))return;
      const idx=exercises.findIndex(e=>e.id===exId);
      if(idx!==-1)exercises.splice(idx,1);
      save();closeModal();showProgram();
    });
  }
}

function closeModal(){const o=$i('modal-ov');if(o)o.remove();}

// ── HISTORY SCREEN ─────────────────────────────────────────
function showHistory() {
  const p = prof();
  const a = app(); a.innerHTML='';
  const hdr = el('div','hdr');
  hdr.innerHTML=`<div style="flex:1"><div class="hdr-title">Historique</div><div class="hdr-sub">${p.name}</div></div><div class="avatar" id="av-btn" style="background:${p.color}25;color:${p.color}">${p.initials}</div>`;
  a.appendChild(hdr);
  $i('av-btn').addEventListener('click', () => nav('profile'));
  const c = el('div','screen');
  const logs = [...(p.logs||[])].sort((a,b)=>b.date.localeCompare(a.date));

  if(logs.length===0){
    c.innerHTML='<div class="empty"><span class="empty-ico">📊</span><div>Aucune séance enregistrée</div></div>';
  }

  logs.forEach(lg=>{
    const exercises = p.seances[lg.seance]||[];
    const doneEx = Object.keys(lg.sets||{}).length;
    const item = el('div','hist-item');
    item.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:36px;height:36px;border-radius:8px;background:${p.color}25;color:${p.color};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${lg.seance}</div><div style="flex:1"><div style="font-size:14px;font-weight:600">${fmtDate(lg.date)}</div><div style="font-size:12px;color:var(--text2);margin-top:2px">${doneEx} exercice${doneEx>1?'s':''} · ${lg.totalReps||0} reps · ${lg.totalLb||0} lb</div></div></div>${Object.entries(lg.sets||{}).map(([eid,sets])=>{const ex=exercises.find(e=>e.id===eid);return`<div style="font-size:12px;color:var(--text2);padding:4px 0 0"><strong style="color:var(--text3)">${ex?ex.name:eid}</strong> — ${sets.map((s,i)=>`S${i+1}: ${s.r}×${s.w}lb`).join(' · ')}</div>`;}).join('')}`;
    c.appendChild(item);
  });
  a.appendChild(c);
  renderNav('history');
}

// ── NAV ────────────────────────────────────────────────────
function renderNav(active) {
  const a = app();
  const n = el('div','nav');
  [['training',ico('dumbbell'),'Séance'],['program',ico('settings'),'Programme'],['history',ico('history'),'Historique']].forEach(([id,icon,label])=>{
    const btn = el('button',`nav-item${id===active?' on':''}`);
    btn.innerHTML=icon+`<span>${label}</span>`;
    btn.addEventListener('click',()=>nav(id));
    n.appendChild(btn);
  });
  a.appendChild(n);
}

// ── ROUTER ─────────────────────────────────────────────────
function nav(route) {
  S.route = route;
  if(route==='profile'){S.pid=null;showProfile();return;}
  if(!S.pid){showProfile();return;}
  ({training:showTraining,exercise:showExercise,program:showProgram,history:showHistory}[route]||showTraining)();
}

// ── INIT ───────────────────────────────────────────────────
load();
nav('profile');
</script>
</body>
</html>
