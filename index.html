*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{

html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

.hdr{height:var(--hdrh);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20}

.seance-pill.B{background:var(--clrB2);color:var(--clrB)}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:var(--navh);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}

.card-row:active{background:var(--bg3)}
.ex-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text)}

// ── STATE ───────────────────────────────────────────────────
const S = {
  user:null, profile:null,

  calYear:null, calMonth:null,
  trainingDate:null, trainingSeance:null
};

// ── FIRESTORE SAVE (debounced) ──────────────────────────────
let _saveT = null;
function scheduleSave() {
  clearTimeout(_saveT);
  _saveT = setTimeout(async () => {
    if (S.user && S.profile) {
      try { await setDoc(doc(db,'users',S.user.uid), S.profile); }
      catch(e) { console.error('Save error',e); }
    }
  }, 2000);
}

function prof() { return S.profile; }

// ── HELPERS ─────────────────────────────────────────────────
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(ds) {
  const d = new Date(ds+'T12:00:00');
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function parseSetsMax(v) {
  if (typeof v==='number') return v;
  const p = String(v).split(/[-–]/);
  return parseInt(p[p.length-1])||3;
}
function genId() { return 'ex-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); }
function truncate(s,n) { return s.length>n ? s.slice(0,n)+'…' : s; }

function seanceForDate(p, ds) {
  const start = new Date(p.startDate+'T12:00:00');
  const d     = new Date(ds+'T12:00:00');
  const days  = Math.round((d-start)/86400000);
  if (days<0) return null;
  const week = Math.floor(days/7)+1;
  const dow  = d.getDay();
  const idx  = p.trainingDays.indexOf(dow);
  if (idx===-1) return null;
  const odd  = week%2===1;
  return (odd?['A','B','A']:['B','A','B'])[idx]||'A';
}

function nextAvailableSession(p) {
  const today = new Date();
  for (let i=0; i<14; i++) {
    const d = new Date(today); d.setDate(today.getDate()+i);
    const ds = d.toISOString().slice(0,10);
    const s  = seanceForDate(p,ds);
    if (s && !(p.logs||[]).find(l=>l.date===ds&&l.seance===s)) return {date:ds,seance:s};
  }
  return null;
}

function activeLog(p, date, seance) {
  return (p.logs||[]).find(l=>l.date===date&&l.seance===seance);
}
function lastSets(p, exId) {
  const logs = [...(p.logs||[])].sort((a,b)=>b.date.localeCompare(a.date));
  for (const l of logs) if (l.sets&&l.sets[exId]) return l.sets[exId];
  return null;
}
function calcTotals(sets) {
  let reps=0,lb=0;
  for (const s of Object.values(sets||{})) for (const x of (s||[])) { reps+=x.r||0; lb+=(x.r||0)*(x.w||0); }
  return {reps,lb};
}

// ── PROFILE BUILDER (first login) ──────────────────────────
function buildProfile(user) {
  try {
    const raw = localStorage.getItem('trainapp_v1');
    if (raw) {
      const data = JSON.parse(raw);
      const fn = (user.displayName||'').toLowerCase().split(' ')[0];
      for (const p of Object.values(data)) {
        if (!p.name) continue;
        const pf = p.name.toLowerCase().split(' ')[0];
        if (fn&&pf&&(fn.includes(pf)||pf.includes(fn))) return p;
      }
    }
  } catch {}
  if (user.email===SEB_EMAIL) return {
    name:'Sébastien',initials:'SA',color:'#6366f1',
    startDate:'2026-09-21',trainingDays:[1,3,5],
    notes:"Modèle progression double : 10–12 reps → augmenter la charge ; 6–8 reps → chercher plus de reps. RIR cible 2–3, éviter 0.",
    seances:{A:SEB_A,B:SEB_B},logs:SEB_LOGS,programVersion:PROG_VER
  };
  const dn = user.displayName||'Utilisateur';
  return {
    name:dn,
    initials:dn.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
    color:'#a855f7',
    startDate:new Date().toISOString().slice(0,10),
    trainingDays:[1,3,5],notes:'',
    seances:{A:[],B:[]},logs:[]
  };
}

// ── DOM HELPERS ─────────────────────────────────────────────
const $i = id => document.getElementById(id);
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html!==undefined) e.innerHTML = html;
  return e;
}
function getApp() { return $i('app'); }

// ── CALENDAR ─────────────────────────────────────────────────
function showCalendar() {
  const p = prof();
  const today = todayStr();
  const now = new Date();
  if (S.calYear===null) { S.calYear=now.getFullYear(); S.calMonth=now.getMonth(); }
  const year=S.calYear, month=S.calMonth;

  const a=getApp(); a.innerHTML='';
  const hdr=el('div','hdr');
  hdr.innerHTML=`<div class="hdr-title">Calendrier</div>
    <button id="av" class="avatar" style="background:${p.color}25;color:${p.color}">${p.initials}</button>`;
  a.appendChild(hdr);
  $i('av').addEventListener('click',()=>{ if(confirm('Se déconnecter ?')) signOut(auth); });

  const c=el('div','screen');
  a.appendChild(c);

  // TODAY CARD
  const todaySe=seanceForDate(p,today);
  const todayLg=(p.logs||[]).find(l=>l.date===today);
  const tc=el('div','today-card');
  if (todayLg) {
    const tots=calcTotals(todayLg.sets);
    tc.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
      <div class="cal-badge d${todayLg.seance}" style="width:36px;height:34px;font-size:15px;border-radius:8px">${todayLg.seance}</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">Séance ${todayLg.seance} terminée ✓</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">${tots.reps} reps · ${tots.lb} lb</div></div>
      <button class="btn btn-ghost" id="td-hist" style="font-size:12px;padding:6px 10px">Détails</button>
    </div>`;
    c.appendChild(tc);
    $i('td-hist').addEventListener('click',()=>showLogModal(todayLg));
  } else if (todaySe) {
    tc.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
      <div class="cal-badge p${todaySe}" style="width:36px;height:34px;font-size:15px;border-radius:8px">${todaySe}</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">Séance ${todaySe} aujourd'hui</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">${fmtDate(today)}</div></div>
      <button class="btn btn-primary" id="td-start" style="font-size:13px;padding:8px 14px">Démarrer</button>
    </div>`;
    c.appendChild(tc);
    $i('td-start').addEventListener('click',()=>{ S.trainingDate=today; S.trainingSeance=todaySe; nav('training'); });
  } else {
    tc.innerHTML=`<div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:22px">😌</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">Jour de repos</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">${fmtDate(today)}</div></div>
      <button class="btn btn-ghost" id="td-pick" style="font-size:12px;padding:6px 10px">Choisir séance</button>
    </div>`;
    c.appendChild(tc);
    $i('td-pick').addEventListener('click',()=>showSessionPicker(today,null));
  }

  // MONTH NAV
  const cn=el('div','cal-nav');
  cn.innerHTML=`<button class="cal-nav-btn" id="prev-m">${ico('back')}</button>
    <div class="cal-nav-lbl">${MONTHS_F[month]} ${year}</div>
    <button class="cal-nav-btn" id="next-m">${ico('chevright')}</button>`;
  c.appendChild(cn);
  $i('prev-m').addEventListener('click',()=>{ S.calMonth=month===0?(S.calYear=year-1,11):month-1; showCalendar(); });
  $i('next-m').addEventListener('click',()=>{ S.calMonth=month===11?(S.calYear=year+1,0):month+1; showCalendar(); });

  if (!(year===now.getFullYear()&&month===now.getMonth())) {
    const tb=el('button','btn btn-ghost');
    tb.style.cssText='font-size:12px;padding:6px 14px;width:100%;margin-bottom:10px';
    tb.textContent='Revenir au mois actuel';
    tb.addEventListener('click',()=>{ S.calYear=now.getFullYear(); S.calMonth=now.getMonth(); showCalendar(); });
    c.appendChild(tb);
  }

  // DOW LABELS
  const dw=el('div','cal-dow');
  ['D','L','M','M','J','V','S'].forEach(d=>{ const l=el('div','cal-dow-lbl'); l.textContent=d; dw.appendChild(l); });
  c.appendChild(dw);

  // GRID
  const grid=el('div','cal-grid');
  const firstDow=new Date(year,month,1).getDay();
  const dim=new Date(year,month+1,0).getDate();
  const todayD=new Date(today+'T12:00:00');

  for (let i=0;i<firstDow;i++) grid.appendChild(el('div','cal-day'));

  const nextUpDs=(()=>{
    const startD=new Date(Math.max(now.getTime(),new Date(year,month,1).getTime()));
    for(let i=0;i<=31;i++){
      const d=new Date(startD);d.setDate(startD.getDate()+i);
      if(d.getFullYear()!==year||d.getMonth()!==month) break;
      const ds=d.toISOString().slice(0,10);
      if(ds===today) continue;
      const s=seanceForDate(p,ds);
      if(s&&!(p.logs||[]).find(l=>l.date===ds)) return ds;
    }
    return null;
  })();

  for (let d=1;d<=dim;d++) {
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===today;
    const cellD=new Date(ds+'T12:00:00');
    const isPast=cellD<todayD;
    const diff=Math.round((todayD-cellD)/86400000);
    const planned=seanceForDate(p,ds);
    const log=(p.logs||[]).find(l=>l.date===ds);
    const isCatchup=isPast&&!log&&planned&&diff<=CATCHUP;
    const isNextUp=ds===nextUpDs;

    let hasEv=!!(log||(isPast&&planned)||(!isPast&&planned));
    const cell=el('div',`cal-day${isToday?' today':''}${isNextUp?' next-up':''}${hasEv?' has-ev':''}`);
    const num=el('div','cal-day-num'); num.textContent=d; cell.appendChild(num);

    if (log) {
      const b=el('div',`cal-badge d${log.seance}`); b.textContent=log.seance; cell.appendChild(b);
      const st=el('div','cal-stat ok'); st.textContent='✓'; cell.appendChild(st);
      cell.addEventListener('click',()=>showLogModal(log));
    } else if (isPast&&planned) {
      const b=el('div',`cal-badge ${isCatchup?'cup':'p'+planned}`); b.textContent=planned; cell.appendChild(b);
      if(!isCatchup) b.style.opacity='.4';
      cell.addEventListener('click',()=>showSessionPicker(ds,planned));
    } else if (!isPast&&planned) {
      const b=el('div',`cal-badge p${planned}`); b.textContent=planned; cell.appendChild(b);
      cell.addEventListener('click',()=>showSessionPicker(ds,planned));
    }
    grid.appendChild(cell);
  }
  c.appendChild(grid);

  // LEGEND
  const leg=el('div','cal-legend');
  leg.innerHTML=`
    <div class="cal-leg-item"><div class="cal-badge dA" style="width:20px;height:18px;font-size:9px">A</div> Réalisé</div>
    <div class="cal-leg-item"><div class="cal-badge cup" style="width:20px;height:18px;font-size:9px">A</div> Rattrapage</div>
    <div class="cal-leg-item"><div class="cal-badge pA" style="width:20px;height:18px;font-size:9px">A</div> Planifié</div>
  `;
  c.appendChild(leg);
  renderNav('calendar');
}

// ── SESSION PICKER MODAL ─────────────────────────────────────
function showSessionPicker(date, suggested) {
  const p=prof();
  let sel=suggested||'A';
  const ov=el('div','modal-ov'); ov.id='modal-ov';
  const m=el('div','modal');

  function render() {
    const exs=p.seances[sel]||[];
    const preview=exs.slice(0,3).map(e=>`• ${e.name}`).join('<br>');
    const more=exs.length>3?`<br>• …et ${exs.length-3} autres`:'';
    m.innerHTML=`
      <div class="modal-title">Choisir la séance</div>
      <div style="text-align:center;color:var(--text2);font-size:13px;margin-bottom:16px">${fmtDate(date)}</div>
      <div class="tabs"><button class="tab-btn${sel==='A'?' on':''}" data-s="A">Séance A</button><button class="tab-btn${sel==='B'?' on':''}" data-s="B">Séance B</button></div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:16px;min-height:48px">
        ${exs.length?preview+more:'<span style="color:var(--text3)">Aucun exercice configuré</span>'}
      </div>
      <button id="pk-start" class="btn btn-primary" style="width:100%">Démarrer Séance ${sel}</button>
    `;
    m.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{ sel=b.dataset.s; render(); }));
    m.querySelector('#pk-start').addEventListener('click',()=>{ S.trainingDate=date>todayStr()?todayStr():date; S.trainingSeance=sel; closeModal(); nav('training'); });
  }

  render();
  ov.appendChild(m);
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
}

// ── TRAINING SCREEN ──────────────────────────────────────────
function showTraining() {
  const p=prof();
  if (!S.trainingDate||!S.trainingSeance) {
    const ns=nextAvailableSession(p);
    if (ns) { S.trainingDate=ns.date; S.trainingSeance=ns.seance; }
    else {
      const a=getApp(); a.innerHTML='<div class="empty"><span class="empty-ico">😕</span><div>Aucune séance planifiée</div></div>';
      renderNav('training'); return;
    }
  }
  const date=S.trainingDate, seance=S.trainingSeance;
  const exercises=p.seances[seance]||[];
  const log=activeLog(p,date,seance);
  const logSets=log?log.sets:{};
  const tots=calcTotals(logSets);
  const doneCount=Object.keys(logSets).length;
  const sc=seance==='A'?'sa':'sb';

  const a=getApp(); a.innerHTML='';
  const hdr=el('div','hdr');
  hdr.innerHTML=`<button class="back-btn" id="back">${ico('back')}</button>
    <div style="flex:1"><div class="hdr-title">Entraînement</div>
    <div class="hdr-sub"><span class="seance-pill ${seance}">Séance ${seance}</span><span>${fmtDate(date)}</span></div></div>`;
  a.appendChild(hdr);
  $i('back').addEventListener('click',()=>nav('calendar'));

  const c=el('div','screen');
  a.appendChild(c);
  const tr=el('div','tots'); tr.id='tot-row';
  tr.innerHTML=`<div class="tot-card"><div class="tot-val" id="tv-reps">${tots.reps}</div><div class="tot-lbl">Reps</div></div><div class="tot-card"><div class="tot-val" style="color:var(--accent2)" id="tv-lb">${tots.lb}</div><div class="tot-lbl">Lb</div></div><div class="tot-card"><div class="tot-val" id="tv-done">${doneCount}/${exercises.length}</div><div class="tot-lbl">Faits</div></div>`;
  c.appendChild(tr);
  const bar=el('div','prog-bar');
  bar.innerHTML=`<div class="prog-fill" id="prog" style="width:${exercises.length?doneCount/exercises.length*100:0}%"></div>`;
  c.appendChild(bar);

  if (!exercises.length) { c.innerHTML+='<div class="empty" style="padding:32px 0"><span class="empty-ico">📋</span><div>Aucun exercice — configure dans Programme</div></div>'; }

  exercises.forEach((ex,i)=>{
    const letter=String.fromCharCode(65+i);
    const done=logSets[ex.id];
    const lp=lastSets(p,ex.id);
    const card=el('div','card');
    const row=el('div','card-row');
    const summary=done?done.map(s=>`${s.r}×${s.w}lb`).join(' · '):`${ex.sets} sets · ${ex.repsMin}–${ex.repsMax} reps`;
    row.innerHTML=`<div class="ex-badge ${done?'done':sc}">${done?ico('check'):letter}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div>
      <div style="font-size:12px;color:${done?'var(--ok)':'var(--text2)'};margin-top:2px">${summary}</div></div>
      ${ico('chevright').replace('<svg','<svg style="width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0"')}`;
    row.addEventListener('click',()=>{ S.exId=ex.id; nav('exercise'); });
    card.appendChild(row);
    if (lp&&!done) {
      const lpe=el('div','lp');
      lpe.innerHTML=`Dernière fois : <strong style="color:var(--text2)">${lp.map(s=>`${s.r}×${s.w}lb`).join(' · ')}</strong>`;
      card.appendChild(lpe);
    }
    c.appendChild(card);
  });

  if (p.notes) {
    const n=el('div','card'); n.style.marginTop='8px';
    n.innerHTML=`<div style="padding:12px 14px;font-size:12px;color:var(--text2);border-left:3px solid var(--accent);line-height:1.6">${p.notes}</div>`;
    c.appendChild(n);
  }
  renderNav('training');
}

// ── EXERCISE SCREEN ──────────────────────────────────────────
function showExercise() {
  const p=prof();
  if (!S.trainingDate||!S.trainingSeance) return nav('calendar');
  const date=S.trainingDate, seance=S.trainingSeance;
  const exercises=p.seances[seance]||[];
  const exIdx=exercises.findIndex(e=>e.id===S.exId);
  const ex=exercises[exIdx];
  if (!ex) return nav('training');
  const prevEx=exercises[exIdx-1]||null, nextEx=exercises[exIdx+1]||null;
  const log=activeLog(p,date,seance);
  const existSets=(log&&log.sets&&log.sets[ex.id])||[];
  const lp=lastSets(p,ex.id);
  const numSets=parseSetsMax(ex.sets);

  const a=getApp(); a.innerHTML='';
  const hdr=el('div','hdr');
  hdr.innerHTML=`<button class="back-btn" id="back">${ico('back')}</button>
    <div style="flex:1"><div class="hdr-title" style="font-size:15px">${ex.name}</div>
    <div class="hdr-sub"><span class="seance-pill ${seance}">Séance ${seance}</span><span>${exIdx+1}/${exercises.length}</span></div></div>
    ${nextEx?`<button class="next-btn" id="ex-next">${ico('chevright')}</button>`:''}`;
  a.appendChild(hdr);
  $i('back').addEventListener('click',()=>nav('training'));
  if (nextEx) $i('ex-next').addEventListener('click',()=>{ S.exId=nextEx.id; showExercise(); });

  const c=el('div','screen');
  a.appendChild(c);

  if (ex.dbId) {
    const dr=el('div','demo-row');
    dr.innerHTML=`<img class="demo-img" src="${IMG_BASE}${ex.dbId}/0.jpg" loading="lazy" onerror="this.parentNode.innerHTML='<div class=demo-ph>Image non disponible</div>'" alt="Départ"><img class="demo-img" src="${IMG_BASE}${ex.dbId}/1.jpg" loading="lazy" onerror="this.style.display='none'" alt="Arrivée">`;
    c.appendChild(dr);
  } else {
    const ph=el('div','demo-row');
    ph.innerHTML=`<div class="demo-ph" style="flex:1;aspect-ratio:3/1"><div style="font-size:20px;margin-bottom:6px">💪</div><div>Aucune démo — ajoute un ID dans Programme</div></div>`;
    c.appendChild(ph);
  }

  const chips=el('div','chips');
  chips.innerHTML=`<span class="chip">${ex.sets} sets</span><span class="chip">${ex.repsMin}–${ex.repsMax} reps</span>${ex.workingMax?`<span class="chip wm" id="wm-chip">WM ${ex.workingMax} lb</span>`:''}`;
  c.appendChild(chips);

  if (ex.notes) {
    const n=el('div','card'); n.style.marginBottom='12px';
    n.innerHTML=`<div style="padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.6">${ex.notes}</div>`;
    c.appendChild(n);
  }

  const st=el('div','sec-ttl'); st.textContent='Logger les sets'; c.appendChild(st);
  const sc=el('div','card'); sc.id='sets-card';
  const sh=el('div');
  sh.style.cssText='display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border)';
  sh.innerHTML='<div style="font-size:11px;color:var(--text3);text-align:center">#</div><div style="font-size:11px;color:var(--text3);text-align:center">Reps</div><div style="font-size:11px;color:var(--text3);text-align:center">Poids (lb)</div><div></div>';
  sc.appendChild(sh);

  for (let i=0;i<numSets;i++) {
    const saved=existSets[i], prev=lp&&lp[i], ck=!!saved;
    const row=el('div','set-grid'); row.id=`sr-${i}`;
    row.innerHTML=`<div class="set-lbl">${i+1}</div><input id="r-${i}" type="number" min="0" max="99" inputmode="numeric" class="set-inp${ck?' ck':''}" value="${ck?saved.r:(prev?prev.r:'')}" placeholder="${ex.repsMin}"><input id="w-${i}" type="number" min="0" max="999" step="2.5" inputmode="decimal" class="set-inp${ck?' ck':''}" value="${ck?saved.w:(prev?prev.w:'0')}" placeholder="lb"><button class="chk-btn${ck?' done':''}" data-i="${i}">${ico('check')}</button>`;
    if (ck) row.style.opacity='.8';
    sc.appendChild(row);
  }
  c.appendChild(sc);

  if (lp) {
    const lpe=el('div'); lpe.style.cssText='font-size:11px;color:var(--text3);padding:6px 2px 0;margin-bottom:12px';
    lpe.innerHTML='Dernière fois : '+lp.map((s,i)=>`<strong style="color:var(--text2)">S${i+1}: ${s.r}×${s.w}lb</strong>`).join(' · ');
    c.appendChild(lpe);
  }

  const wmc=el('div','card'); wmc.style.marginTop='14px';
  wmc.innerHTML=`<div style="padding:12px 14px;display:flex;align-items:center;gap:12px"><div style="flex:1;font-size:13px">Working Max</div><input id="wm-inp" type="number" inputmode="decimal" style="width:80px" class="set-inp" value="${ex.workingMax||''}" placeholder="lb"><button id="wm-save" class="btn btn-ghost" style="padding:8px 12px;font-size:12px">Sauver</button></div>`;
  c.appendChild(wmc);

  const nr=el('div',''); nr.style.cssText='display:flex;gap:8px;margin-top:14px';
  if (prevEx) {
    const pb=el('button','btn btn-ghost'); pb.style.flex='1';
    pb.innerHTML=`${ico('back')} ${truncate(prevEx.name,14)}`;
    pb.addEventListener('click',()=>{ S.exId=prevEx.id; showExercise(); });
    nr.appendChild(pb);
  }
  if (nextEx) {
    const nb=el('button','btn btn-primary'); nb.style.flex='1';
    nb.innerHTML=`${truncate(nextEx.name,14)} ${ico('chevright')}`;
    nb.addEventListener('click',()=>{ S.exId=nextEx.id; showExercise(); });
    nr.appendChild(nb);
  } else {
    const fb=el('button','btn btn-primary'); fb.style.flex='1';
    fb.innerHTML=`${ico('check')} Terminer la séance`;
    fb.addEventListener('click',()=>{ S.trainingDate=null; S.trainingSeance=null; nav('calendar'); });
    nr.appendChild(fb);
  }
  c.appendChild(nr);
  renderNav('training');

  sc.querySelectorAll('.chk-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.i);
      const rIn=$i(`r-${i}`), wIn=$i(`w-${i}`);
      const r=parseInt(rIn.value)||0, w=parseFloat(wIn.value)||0;
      const already=btn.classList.contains('done');
      let lg=activeLog(p,date,seance);
      if (!lg) { lg={id:`${date}-${seance}`,date,seance,sets:{},totalReps:0,totalLb:0}; p.logs.push(lg); }
      if (!lg.sets) lg.sets={};
      if (already) {
        if (lg.sets[ex.id]) { lg.sets[ex.id].splice(i,1); if (!lg.sets[ex.id].length) delete lg.sets[ex.id]; }
        btn.classList.remove('done'); rIn.classList.remove('ck'); wIn.classList.remove('ck');
        $i(`sr-${i}`).style.opacity='1';
      } else {
        if (!lg.sets[ex.id]) lg.sets[ex.id]=[];
        lg.sets[ex.id][i]={r,w};
        btn.classList.add('done'); rIn.classList.add('ck'); wIn.classList.add('ck');
        $i(`sr-${i}`).style.opacity='.8';
        if (w>0 && w>(ex.workingMax||0)) {
          ex.workingMax=w;
          const chip=$i('wm-chip');
          if (chip) chip.textContent=`WM ${w} lb`;
          else { const nc=el('span','chip wm'); nc.id='wm-chip'; nc.textContent=`WM ${w} lb`; c.querySelector('.chips').appendChild(nc); }
          $i('wm-inp').value=w;
        }
      }
      const t=calcTotals(lg.sets); lg.totalReps=t.reps; lg.totalLb=t.lb;
      scheduleSave();
      const rEl=$i('tv-reps'), lEl=$i('tv-lb'), dEl=$i('tv-done'), pg=$i('prog');
      if(rEl) rEl.textContent=t.reps;
      if(lEl) lEl.textContent=t.lb;
      const dc=Object.keys(lg.sets).length;
      if(dEl) dEl.textContent=`${dc}/${exercises.length}`;
      if(pg) pg.style.width=`${exercises.length?dc/exercises.length*100:0}%`;
    });
  });

  $i('wm-save').addEventListener('click',()=>{
    const v=parseFloat($i('wm-inp').value);
    if (!isNaN(v)&&v>0) {
      ex.workingMax=v; scheduleSave();
      const chip=$i('wm-chip');
      if (chip) chip.textContent=`WM ${v} lb`;
      else { const nc=el('span','chip wm'); nc.id='wm-chip'; nc.textContent=`WM ${v} lb`; c.querySelector('.chips').appendChild(nc); }
      const sb=$i('wm-save'); sb.textContent='✓'; setTimeout(()=>{ if(sb) sb.textContent='Sauver'; },1500);
    }
  });
}

// ── PROGRAM SCREEN ───────────────────────────────────────────
function showProgram() {
  const p=prof();
  const a=getApp(); a.innerHTML='';
  const hdr=el('div','hdr');
  hdr.innerHTML=`<div style="flex:1"><div class="hdr-title">Programme</div><div class="hdr-sub">${p.name}</div></div>
    <button id="av" class="avatar" style="background:${p.color}25;color:${p.color}">${p.initials}</button>`;
  a.appendChild(hdr);
  $i('av').addEventListener('click',()=>{ if(confirm('Se déconnecter ?')) signOut(auth); });

  const c=el('div','screen');
  a.appendChild(c);
  const tabs=el('div','tabs');
  tabs.innerHTML=`<button class="tab-btn${S.progTab==='A'?' on':''}" data-s="A">Séance A</button><button class="tab-btn${S.progTab==='B'?' on':''}" data-s="B">Séance B</button>`;
  tabs.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{ S.progTab=b.dataset.s; showProgram(); }));
  c.appendChild(tabs);

  const exercises=p.seances[S.progTab]||[];
  if (!exercises.length) {
    const em=el('div','empty'); em.style.padding='32px 0';
    em.innerHTML='<span class="empty-ico">📋</span><div>Aucun exercice dans cette séance</div>';
    c.appendChild(em);
  }
  exercises.forEach((ex,i)=>{
    const letter=String.fromCharCode(65+i);
    const sc=S.progTab==='A'?'sa':'sb';
    const card=el('div','card'); card.style.marginBottom='8px';
    const row=el('div','card-row'); row.style.cursor='default';
    row.innerHTML=`<div class="ex-badge ${sc}">${letter}</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div><div style="font-size:12px;color:var(--text2)">${ex.sets} sets · ${ex.repsMin}–${ex.repsMax} reps${ex.workingMax?` · WM ${ex.workingMax} lb`:''}</div></div><button class="btn btn-ghost edit-btn" data-id="${ex.id}" style="padding:6px 10px;font-size:12px;flex-shrink:0">${ico('edit')} Modifier</button>`;
    card.appendChild(row);
    c.appendChild(card);
  });

  const addBtn=el('button','btn btn-primary'); addBtn.style.cssText='width:100%;margin-top:4px';
  addBtn.innerHTML=`${ico('plus')} Ajouter un exercice`;
  addBtn.addEventListener('click',()=>showExModal(null));
  c.appendChild(addBtn);

  const cfgTtl=el('div','sec-ttl'); cfgTtl.textContent='Configuration du profil'; c.appendChild(cfgTtl);
  const cfg=el('div','card');
  cfg.innerHTML=`<div style="padding:14px">
    <div class="f-group"><label class="f-label">Jours d'entraînement (0=Dim,1=Lun,2=Mar…)</label><input id="cfg-days" class="f-input" value="${p.trainingDays.join(',')}"></div>
    <div class="f-group"><label class="f-label">Date de début (AAAA-MM-JJ)</label><input id="cfg-start" class="f-input" type="date" value="${p.startDate}"></div>
    <div class="f-group"><label class="f-label">Notes du programme</label><textarea id="cfg-notes" class="f-input">${p.notes||''}</textarea></div>
    <button id="cfg-save" class="btn btn-ghost" style="width:100%">Sauvegarder</button>
  </div>`;
  c.appendChild(cfg);
  renderNav('program');

  c.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click',()=>showExModal(b.dataset.id)));
  $i('cfg-save').addEventListener('click',()=>{
    const dr=$i('cfg-days').value.split(',').map(x=>parseInt(x.trim())).filter(n=>!isNaN(n)&&n>=0&&n<=6);
    if(dr.length) p.trainingDays=dr;
    const sd=$i('cfg-start').value; if(sd) p.startDate=sd;
    p.notes=$i('cfg-notes').value;
    scheduleSave();
    const btn=$i('cfg-save'); btn.textContent='✓ Sauvegardé'; setTimeout(()=>{ if(btn) btn.textContent='Sauvegarder'; },2000);
  });
}

// ── EXERCISE MODAL ───────────────────────────────────────────
function showExModal(exId) {
  const p=prof();
  const exercises=p.seances[S.progTab]||[];
  const ex=exId?exercises.find(e=>e.id===exId):null;
  const isNew=!ex;
  const ov=el('div','modal-ov'); ov.id='modal-ov';
  const m=el('div','modal');
  m.innerHTML=`<div style="display:flex;align-items:center;margin-bottom:16px"><div class="modal-title" style="flex:1;margin:0">${isNew?'Ajouter un exercice':'Modifier l\'exercice'}</div><button id="m-close" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1">✕</button></div>
  <div class="f-group"><label class="f-label">Nom *</label><input id="f-name" class="f-input" value="${ex?ex.name:''}" placeholder="ex: GD Hip Thrust" autocomplete="off"></div>
  <div class="f-row">
    <div class="f-group"><label class="f-label">Sets</label><input id="f-sets" class="f-input" value="${ex?ex.sets:'3'}" placeholder="3 ou 2–3"></div>
    <div class="f-group"><label class="f-label">Reps min / max</label><div style="display:flex;gap:6px"><input id="f-rmin" type="number" class="f-input" value="${ex?ex.repsMin:8}"><input id="f-rmax" type="number" class="f-input" value="${ex?ex.repsMax:12}"></div></div>
  </div>
  <div class="f-group"><label class="f-label">Working Max (lb)</label><input id="f-wm" type="number" class="f-input" value="${ex&&ex.workingMax?ex.workingMax:''}"></div>
  <div class="f-group"><label class="f-label">Notes du coach</label><textarea id="f-notes" class="f-input">${ex?ex.notes:''}</textarea></div>
  <div class="f-group"><label class="f-label">Exercise DB ID <span style="color:var(--text3);font-size:10px">(images démo — <a href="https://github.com/yuhonas/free-exercise-db/tree/main/exercises" target="_blank" style="color:var(--accent)">voir la liste</a>)</span></label><input id="f-dbid" class="f-input" value="${ex?ex.dbId:''}" autocomplete="off" placeholder="ex: Dumbbell_Bench_Press"></div>
  ${!isNew?`<button id="del-ex" class="btn btn-danger" style="width:100%;margin-bottom:10px">${ico('trash')} Supprimer</button>`:''}
  <button id="save-ex" class="btn btn-primary" style="width:100%">${isNew?ico('plus')+' Ajouter':ico('check')+' Sauvegarder'}</button>`;
  ov.appendChild(m);
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  $i('m-close').addEventListener('click',closeModal);
  $i('save-ex').addEventListener('click',()=>{
    const name=$i('f-name').value.trim();
    if (!name) { $i('f-name').focus(); return; }
    const data={id:ex?ex.id:genId(),name,sets:$i('f-sets').value||'3',repsMin:parseInt($i('f-rmin').value)||8,repsMax:parseInt($i('f-rmax').value)||12,workingMax:parseFloat($i('f-wm').value)||null,notes:$i('f-notes').value,dbId:$i('f-dbid').value.trim(),ytId:''};
    if (!p.seances[S.progTab]) p.seances[S.progTab]=[];
    if (isNew) p.seances[S.progTab].push(data);
    else { const idx=exercises.findIndex(e=>e.id===exId); if(idx!==-1) exercises[idx]=data; }
    scheduleSave(); closeModal(); showProgram();
  });
  if (!isNew) $i('del-ex').addEventListener('click',()=>{
    if (!confirm(`Supprimer « ${ex.name} » ?`)) return;
    const idx=exercises.findIndex(e=>e.id===exId);
    if (idx!==-1) exercises.splice(idx,1);
    scheduleSave(); closeModal(); showProgram();
  });
}

function closeModal() { const o=$i('modal-ov'); if(o) o.remove(); }

// ── LOG DETAIL MODAL ─────────────────────────────────────────
function showLogModal(log) {
  const p=prof();
  const exercises=p.seances[log.seance]||[];
  const doneEx=Object.keys(log.sets||{}).length;
  const ov=el('div','modal-ov'); ov.id='modal-ov';
  const m=el('div','modal');
  m.innerHTML=`
    <div style="display:flex;align-items:center;margin-bottom:16px">
      <div style="width:38px;height:38px;border-radius:9px;background:${log.seance==='A'?'var(--clrA2)':'var(--clrB2)'};color:${log.seance==='A'?'var(--clrA)':'var(--clrB)'};display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;margin-right:12px;flex-shrink:0">${log.seance}</div>
      <div style="flex:1"><div style="font-size:15px;font-weight:600">${fmtDate(log.date)}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px">${doneEx} exercice${doneEx>1?'s':''} · ${log.totalReps||0} reps · ${log.totalLb||0} lb</div></div>
      <button id="m-close" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1;flex-shrink:0">✕</button>
    </div>
    ${Object.entries(log.sets||{}).map(([eid,sets])=>{
      const ex=exercises.find(e=>e.id===eid);
      return `<div style="margin-bottom:8px;padding:10px 12px;background:var(--bg3);border-radius:var(--rr)">
        <div style="font-size:13px;font-weight:500;margin-bottom:6px">${ex?ex.name:eid}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${sets.map((s,i)=>`<span class="chip" style="font-size:11px">S${i+1}: ${s.r}×${s.w}lb</span>`).join('')}</div>
      </div>`;
    }).join('')}
  `;
  ov.appendChild(m);
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  $i('m-close').addEventListener('click',closeModal);
}

// ── NAV (3 tabs) ─────────────────────────────────────────────
function renderNav(active) {
  const a=getApp();
  const n=el('div','nav');
  [['calendar',ico('calendar'),'Calendrier'],['training',ico('dumbbell'),'Séance'],['program',ico('settings'),'Programme']].forEach(([id,icon,label])=>{
    const btn=el('button',`nav-item${id===active?' on':''}`);
    btn.innerHTML=icon+`<span>${label}</span>`;
    btn.addEventListener('click',()=>nav(id));
    n.appendChild(btn);
  });
  a.appendChild(n);
}

// ── ROUTER ───────────────────────────────────────────────────
function nav(route) {
  S.route=route;
  ({calendar:showCalendar,training:showTraining,exercise:showExercise,program:showProgram}[route]||showCalendar)();
}

// ── FIREBASE AUTH OBSERVER ───────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (user) {
    S.user=user;
    showLoading();
    try {
      const snap=await getDoc(doc(db,'users',user.uid));
      S.profile=snap.exists()?snap.data():buildProfile(user);
      if (!snap.exists()) await setDoc(doc(db,'users',user.uid),S.profile);
      else if (user.email===SEB_EMAIL) {
        const p=S.profile;
        if (!p.programVersion||p.programVersion<PROG_VER) {
          p.seances={A:SEB_A,B:SEB_B};
          p.programVersion=PROG_VER;
          if (!p.logs||p.logs.length===0) p.logs=SEB_LOGS;
          await setDoc(doc(db,'users',user.uid),p);
        }
      }
    } catch(e) {
      console.error('Load error',e);
      S.profile=buildProfile(user);
    }
    nav('calendar');
  } else {
    S.user=null; S.profile=null;
    showAuth();
  }
});
</script>
</body>
</html>
